name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vite:
    name: Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d # v1.6.0
        with:
          cache: true

      - run: vp install
      - run: vp run -r generate
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
